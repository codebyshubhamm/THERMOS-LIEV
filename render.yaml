services:
  - type: web
    name: thermos-backend
    env: python
    rootDir: backend-ml/Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_LIVE_FIRMS
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: AI_MODEL
        value: gemini-3.1-flash-lite
      - key: FIRMS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
